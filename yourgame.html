<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your game</title>
    <link rel="icon" type ="image/png" href="icon.jpg" />
        <style>
        
        /* Video Background - Fixed behind everything */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 40, 0.7);
            z-index: -1;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 50px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffd700, #ff7e5f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: 4s ease-in-out infinite;
            letter-spacing: 1px;
        } 


        @keyframes glow {
    0% {
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.5),
                     0 0 40px rgba(255, 126, 95, 0.3);
    }
    100% {
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.8),
                     0 0 60px rgba(255, 126, 95, 0.5),
                     0 0 80px rgba(254, 180, 123, 0.3);
    }
        }


        Changesheader {
            text-align: center;
            margin-bottom: 20px;
        }
        /* Navigation Styles */
        nav {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        /* Menu Icon (Hamburger) */
        .menu-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
        }

        .menu-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .menu-icon span {
            display: block;
            width: 20px;
            height: 2px;
            background: #ffd700;
            transition: all 0.3s ease;
        }

        .menu-icon:hover span {
            background: #ffed4e;
        }

        /* Dropdown Menu - Hidden by default */
        #drop_down_menu {
            position: absolute;
            top: 50px;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        /* Show menu on hover */
        nav:hover #drop_down_menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Menu Items */
        #drop_down_menu li {
            list-style: none;
            margin: 0;
        }

        #drop_down_menu li a {
            display: block;
            padding: 12px 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        #drop_down_menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 25px;
        }

        /* Menu item separators */
        #drop_down_menu li:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
      

  
    </style>
</head>
<body>
  <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop id="bgVideo">
            <source src="videoshort.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>
<header>
        <h1> Your Game </h1>
        <p class="subtitle"> Upload your wordset to practise</p>
</header> 
<nav>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul id="drop_down_menu">
            <li><a href="home.html">Home</a></li>
            <li><a href="game.html">Default Game</a></li>
            <li><a href="yourgame.html">Your Game</a></li>
            <li><a href="about.html">Find out more</a></li>
        </ul>
</nav>
</body>
</html>
